[package]
name = "autosort-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
globset = "0.4.21"
kamadak-exif = "0.6.2"
notify = "8.2.2"
pdf-extract = "0.12.1"
plist = "1.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.3.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

# extended attributes (download origin, tags) only exist on unix filesystems
[target.'cfg(unix)'.dependencies]
xattr = "1.7.0"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
