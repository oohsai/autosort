[package]
name = "autosort"
version = "0.1.0"
edition = "2024"
description = "Rule-based automatic file organiser (cross-platform)"

[dependencies]
auto-launch = "0.6.0"
autosort-core = { path = "../autosort-core" }
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
notify-rust = "4.19.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26.1"
